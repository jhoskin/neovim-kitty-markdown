# Build the helper for the three supported targets when a version tag is
# pushed and attach the tarballs to the GitHub release. The plugin downloads
# `kitty-markdown-helper-<target>.tar.gz` from that release (R-191, R-192).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: >
          cargo build --release --locked
          --manifest-path helper/Cargo.toml
          --target ${{ matrix.target }}
      - name: Package
        run: >
          tar -C helper/target/${{ matrix.target }}/release
          -czf kitty-markdown-helper-${{ matrix.target }}.tar.gz
          kitty-markdown-helper
      - uses: softprops/action-gh-release@v2
        with:
          files: kitty-markdown-helper-${{ matrix.target }}.tar.gz
